  <!-- Inline splash loader style -->
  <style>
    #app-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;transition:opacity .4s}
    #app-splash.hide{opacity:0;pointer-events:none}
    #app-splash .logo{width:72px;height:72px;border-radius:18px;margin-bottom:16px;animation:pulse-glow 1.8s ease-in-out infinite}
    #app-splash .bar-wrap{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
    #app-splash .bar{width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#60a5fa);animation:load-bar 1.2s ease-in-out infinite}
    @keyframes load-bar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    @keyframes pulse-glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  </style>
</head>
<body class="antialiased font-sans webkit-tap-highlight-transparent bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-200">
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Native splash screen while JS loads -->
  <div id="app-splash">
    <img class="logo" src="/icon-192.png" alt="Krixov" />
    <div class="bar-wrap"><div class="bar"></div></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
